<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Consultation — ArogyaX</title>
    <link rel="icon" href="../static/images/arogyax_logo.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
        crossorigin="anonymous" />
    <link rel="stylesheet" href="../static/css/style.css">
</head>

<body>
    <header class="header">
        <a href="/" class="logo">
            <img src="../static/images/arogyax_logo.png" alt="Logo">
            <span class="brand-name">Arogya<span>X</span></span>
        </a>
        <nav class="navbar">
            <a href="/">Dashboard</a>
            <a href="{{url_for('logout')}}" class="btn btn-outline" style="padding:7px 16px;font-size:0.85rem;"><i
                    class="fas fa-sign-out-alt"></i> Logout</a>
            <div class="user-pill">
                <div class="avatar">{{ username[0]|upper }}</div>
                {{ username }}
            </div>
        </nav>
    </header>

    <div class="videocall-container">
        <div style="margin-bottom:1.5rem;">
            <a href="/" style="color:var(--text-muted);font-size:0.85rem;"><i class="fas fa-arrow-left"></i> Back to
                Dashboard</a>
        </div>
        <div class="page-hero" style="margin-bottom:1.5rem;">
            <h1>Video <span>Consultation</span></h1>
            <p>Join a secure video call with your doctor. Ensure your camera and microphone are enabled before joining.
            </p>
        </div>
        <div class="videocall-frame">
            <iframe src="https://meet.jit.si/ManipalSevak-{{ username }}"
                allow="camera; microphone; fullscreen; display-capture; autoplay"></iframe>
        </div>
        <div style="margin-top:1.5rem;text-align:center;">
            <div class="alert alert-info" style="display:inline-flex;max-width:600px;">
                <i class="fas fa-info-circle"></i>
                <span>Your video call room is private. Share the URL with your doctor to connect.</span>
            </div>
        </div>
    </div>
    <script src="../static/js/script.js"></script>
</main></div></body>

</html>
